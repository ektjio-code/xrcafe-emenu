<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XR Cafe — Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #faf7f0;
    --ink: #1a2438;
    --ink-soft: #2c3654;
    --accent: #6b5d3f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
  }

  .topbar {
    max-width: 900px;
    width: 100%;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .back {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: color 200ms, border-color 200ms;
  }
  .back:hover, .back:focus-visible {
    color: var(--accent);
    border-bottom-color: var(--accent);
    outline: none;
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink);
  }

  h1 {
    font-family: 'Pinyon Script', cursive;
    font-weight: 400;
    font-size: clamp(40px, 7vw, 60px);
    text-align: center;
    margin: 8px 0 12px;
    line-height: 1;
    color: var(--ink);
  }

  .stage {
    flex: 1;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  model-viewer {
    width: 100%;
    flex: 1;
    min-height: 60vh;
    background: var(--bg);
    --poster-color: transparent;
    --progress-bar-color: var(--accent);
  }

  .ar-button {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 6px 18px rgba(26, 36, 56, 0.18);
    transition: background 200ms, transform 200ms;
  }
  .ar-button:hover { background: var(--accent); }
  .ar-button:active { transform: translateX(-50%) translateY(1px); }

  .hint {
    text-align: center;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 14px;
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  .error {
    margin: 80px auto;
    text-align: center;
    font-style: italic;
    color: var(--ink-soft);
    max-width: 36ch;
    font-size: 18px;
  }
</style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Menu</a>
    <span class="brand">XR Cafe</span>
    <span style="width:54px"></span><!-- spacer to balance back link -->
  </div>

  <h1 id="title"></h1>

  <div class="stage" id="stage"></div>

  <p class="hint" id="hint"></p>

<script>
  // Map slug -> display name + model file basename (without extension).
  // The viewer looks for models/<file>.glb and models/<file>.usdz.
  const ITEMS = {
    'classic-croissant':              { name: 'Classic Croissant',               file: 'croissant'      },
    'chocolate-croissant':            { name: 'Chocolate Croissant',             file: 'choccroissant'  },
    'gourmet-doughnut':               { name: 'Gourmet Doughnut',                file: 'donut'          },
    'whole-carrot-cake':              { name: 'Whole Carrot Cake',               file: 'carrotcake'     },
    'whole-strawberry-chocolate-cake':{ name: 'Whole Strawberry Chocolate Cake', file: 'choccake'       },
  };

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('item');
  const item = slug ? ITEMS[slug] : null;

  const titleEl = document.getElementById('title');
  const stage   = document.getElementById('stage');
  const hint    = document.getElementById('hint');

  if (!item) {
    titleEl.textContent = 'Not found';
    stage.innerHTML = '<p class="error">We couldn’t find that item. <a href="index.html" style="color:inherit">Return to the menu</a>.</p>';
  } else {
    titleEl.textContent = item.name;

    const glb  = `models/${item.file}.glb`;
    const usdz = `models/${item.file}.usdz`;

    // <model-viewer> auto-detects AR support:
    //   - Android Chrome   -> Scene Viewer (uses .glb)
    //   - iOS Safari       -> AR Quick Look (uses .usdz via ios-src)
    //   - Desktop / no AR  -> in-page 3D viewer (uses .glb)
    // The "ar" attribute makes the AR button appear only when a supported AR mode is available.
    stage.innerHTML = `
      <model-viewer
        src="${glb}"
        ios-src="${usdz}"
        alt="3D model of ${item.name}"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        camera-controls
        touch-action="none"
        auto-rotate
        auto-rotate-delay="2500"
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral">
        <button slot="ar-button" class="ar-button">View in your space</button>
      </model-viewer>
    `;

    const mv = stage.querySelector('model-viewer');

    // Show a helpful hint based on AR capability.
    mv.addEventListener('load', () => {
      hint.textContent = mv.canActivateAR
        ? 'Tap “View in your space” to place it in AR.'
        : 'Drag to rotate · scroll or pinch to zoom.';
    });

    mv.addEventListener('error', (e) => {
      stage.innerHTML = `<p class="error">We couldn’t load the 3D model for <em>${item.name}</em>. Please make sure <code>models/${item.file}.glb</code> exists.</p>`;
      hint.textContent = '';
    });
  }
</script>

</body>
</html>
